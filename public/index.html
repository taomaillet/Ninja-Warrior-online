<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ninja Warrior Online</title><link rel="stylesheet" href="style.css"><body><header>⚡ NINJA <b>WARRIOR</b> <small>ONLINE ARENA</small></header><main><section id="menu"><h1>50 ninjas. Un seul sommet.</h1><p>Affronte tes amis et les bots dans quatre manches.</p><input id="name" placeholder="Ton pseudo"><input id="room" placeholder="Nom du salon"><label>Temps par manche <input id="limit" type="number" value="120" min="45" max="300"></label><label><input id="private" type="checkbox" checked> Salon privé</label><button id="create">Créer une partie</button><hr><input id="code" placeholder="Code du salon"><button id="join">Rejoindre</button><button id="list">Salons publics</button><div id="rooms"></div></section><section id="game" hidden><div id="hud"></div><button id="start">Lancer avec 50 candidats</button><button id="next">Manche suivante</button><canvas id="canvas" width="1000" height="540"></canvas><div class="controls"><button data-key="left">◀</button><button data-key="right">▶</button><button data-key="jump">SAUT</button><button data-key="sprint">SPRINT</button><button data-key="climb">GRIMPER</button></div><p>Flèches / espace / Maj / E pour grimper. Maintiens les touches.</p><h2>Classement</h2><div id="ranking"></div></section><p id="error"></p></main><script src="/socket.io/socket.io.js"></script><script src="game.js"></script></body></html>
